name: Release

# Cut a release by pushing a tag: `git tag -a v0.1.1 && git push origin v0.1.1`.
#
# The APK is built and SIGNED here, from the same keystore a local cut uses, so the artifact and its
# certificate are reproducible from the tag instead of depending on whoever built it. The keystore is
# never committed and never archived: it is decoded from secrets into the runner's temp directory,
# used for one assemble, and deleted before any upload step can see it.
#
# Two jobs on purpose: decoding a signing key and running Gradle must not happen with a token that
# can write to the repository, so only the `publish` job holds `contents: write`. GitHub Actions has
# no step-level `permissions`, which makes a separate job the narrowest scope available.
permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-and-sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions are pinned by commit SHA, not by a mutable tag; `v4` can be repointed at any time.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # gradle/gradle-daemon-jvm.properties pins toolchainVersion=25.
      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      # Same SDK discovery as ci.yml: sdkmanager is not on PATH and the
      # preinstalled platforms are used when it cannot be found.
      - name: Put the Android SDK tools on PATH
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME" || { echo "::error::no Android SDK at $ANDROID_HOME"; exit 1; }
          CMDLINE=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name bin -type d 2>/dev/null | head -1)
          if [ -n "${CMDLINE:-}" ]; then echo "$CMDLINE" >> "$GITHUB_PATH"; fi
          ls "$ANDROID_HOME/build-tools" || true

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Same key inputs as ci.yml: everything that can change the toolchain is hashed.
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NIROWEAR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::NIROWEAR_KEYSTORE_BASE64 is not set"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nirowear-release.jks"
          test -s "$RUNNER_TEMP/nirowear-release.jks"

      - name: Build the signed release APK
        env:
          NIROWEAR_KEYSTORE: ${{ runner.temp }}/nirowear-release.jks
          NIROWEAR_KEYSTORE_PASSWORD: ${{ secrets.NIROWEAR_KEYSTORE_PASSWORD }}
          NIROWEAR_KEY_ALIAS: ${{ secrets.NIROWEAR_KEY_ALIAS }}
          NIROWEAR_KEY_PASSWORD: ${{ secrets.NIROWEAR_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      # The keystore has done its job; nothing downstream needs it.
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nirowear-release.jks"

      - name: Verify the signature and record the artifact
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$apk" || { echo "::error::no release APK produced"; exit 1; }
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | tee certs.txt
          # The signer label differs by build-tools version: "Signer #1 certificate DN: …" on older
          # ones, "V2 Signer: certificate DN: …" on 36/37. Anchoring on the label failed a correctly
          # signed APK (run 42201316498), so match the DN itself.
          grep -q "certificate DN: CN=NiroWear Release" certs.txt \
            || { echo "::error::the APK is not signed by the release identity"; exit 1; }
          "$BUILD_TOOLS/aapt2" dump badging "$apk" | grep '^package:' | tee package.txt
          sha256sum "$apk" | tee sha256.txt
          echo "### Signed artifact" >> "$GITHUB_STEP_SUMMARY"
          cat package.txt sha256.txt >> "$GITHUB_STEP_SUMMARY"
          grep "certificate SHA-256" certs.txt >> "$GITHUB_STEP_SUMMARY"

      # The publish job only gets a read-only token, so the APK travels to it as an artifact.
      - name: Upload the signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    # workflow_dispatch from a branch has no version to publish (`GITHUB_REF_NAME` would be the
    # branch), so publishing is tag-only instead of failing after the APK was already signed.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-apk
          path: dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="docs/release/RELEASE_NOTES_${version}.md"
          test -f "$notes" || { echo "::error::missing $notes"; exit 1; }
          apk=$(find dist -name '*.apk' | head -1)
          test -n "$apk" || { echo "::error::the released artifact holds no APK"; exit 1; }
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          {
            cat "$notes"
            echo
            echo "---"
            echo "Artifact: \`$(basename "$apk")\` — SHA-256 \`$sha\`"
          } > "$RUNNER_TEMP/notes.md"
          # `gh release create` is not idempotent, so re-running this workflow after signing failed
          # (or after the tag moved) would die on an existing release. Create on the first run, edit
          # on every later run, then upload the asset with --clobber so the APK is replaced too.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "NiroWear $version" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "NiroWear $version" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
