name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: jvm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned by commit SHA, not by a mutable tag: `v4` can be repointed at any time,
      # and this job's toolchain is what a maintainer trusts. Dependabot's github-actions ecosystem
      # keeps the pins current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # gradle/gradle-daemon-jvm.properties pins toolchainVersion=25, so the
      # runner JVM must be 25 or Gradle provisions a second daemon JVM.
      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      # android-actions/setup-android@v3 is deliberately NOT used: run 40306576936
      # failed inside it with `Failed to find package 'tools'`, because it calls
      # `sdkmanager tools` and that package no longer exists.
      #
      # `sdkmanager` is also not on PATH on ubuntu-latest (run 40306772420 failed
      # with `sdkmanager: command not found`, exit 127), so this step locates it
      # under the preinstalled SDK and appends it to PATH instead of assuming.
      - name: Put the Android SDK tools on PATH
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::no Android SDK at $ANDROID_HOME"; exit 1; }
          CMDLINE=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name bin -type d 2>/dev/null | head -1)
          echo "cmdline-tools bin: ${CMDLINE:-<none>}"
          if [ -n "${CMDLINE:-}" ]; then echo "$CMDLINE" >> "$GITHUB_PATH"; fi
          echo "platforms present:"; ls "$ANDROID_HOME/platforms" || true

      # compileSdk 37 is not on the runner image by default. Gradle can install a
      # missing platform itself when the licence is accepted, which avoids
      # depending on a sdkmanager that may not be on PATH at all.
      - name: Accept SDK licences
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
          else
            echo "sdkmanager still unavailable; relying on the preinstalled platforms"
          fi

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Everything that can change the toolchain is part of the key, so a changed wrapper,
          # daemon JVM, catalog or build script cannot be served a stale dependency cache.
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # The 286-test JVM suite is published as of 2026-11-16, so this step is the gate it always
      # claimed to be. The check below still refuses to let a run that produced no results pass.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # The assertion is CONDITIONAL on purpose. If test sources are present, results are required
      # and their absence fails the job. If they are absent, the job says so and continues — failing
      # there would just be a permanently red CI for a policy decision, and warning there without
      # checking the other branch would let a broken test run pass silently.
      - name: Verify the test step matches reality
        run: |
          set -uo pipefail
          # NOTE: no `set -e`. `find` on a missing directory exits 1, and with `pipefail` that made
          # the whole step die before reaching its own logic — the first version of this check
          # failed CI on a clean clone instead of reporting "no sources". Counting is best-effort;
          # the decision below is explicit.
          sources=$(find app/src/test -name '*.kt' 2>/dev/null | wc -l || echo 0)
          results=$(find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' 2>/dev/null | wc -l || echo 0)
          sources=${sources:-0}
          results=${results:-0}
          echo "test sources: $sources   result XML files: $results"
          if [ "$sources" -gt 0 ] && [ "$results" -eq 0 ]; then
            echo "::error::$sources test sources exist but no results were produced"
            exit 1
          fi
          if [ "$sources" -eq 0 ]; then
            echo "::warning::No test sources are published, so this job ran no tests. Build, lint and style are the real gate."
          fi
          exit 0

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Style
        run: ./gradlew :app:ktlintCheck --console=plain

      - name: Assemble debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  # Runs the instrumented suite on a Wear OS 5 (API 34) emulator — the same API level as the physical
  # Xiaomi Watch 2, at the reference 466x466 @320 viewport. This job exists because a green `jvm` job
  # used to mean "the app compiled": nothing instrumented was even published, so no CI run had ever
  # executed one. First run is the evidence; no number here is quoted from a local machine.
  instrumented:
    name: instrumented (Wear OS 5, API 34, 466x466)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Put the Android SDK tools on PATH
        run: |
          set -euo pipefail
          CMDLINE=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name bin -type d 2>/dev/null | head -1)
          test -n "${CMDLINE:-}" || { echo "::error::no cmdline-tools under $ANDROID_HOME"; exit 1; }
          echo "$CMDLINE" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "emulator: $ANDROID_HOME/emulator/emulator"

      - name: Enable KVM
        run: |
          set -euo pipefail
          # The runner user is not in the `kvm` group, so the device node is crw-rw---- root:kvm and
          # a plain `test -w` fails before the emulator is ever started. Sudo is passwordless here.
          ls -l /dev/kvm || true
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm
          test -w /dev/kvm || { echo "::error::/dev/kvm is not writable; the x86_64 emulator cannot boot"; exit 1; }

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-instrumented-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install the emulator and the Wear OS system image
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # `avdmanager create` refuses to run without the emulator package ("emulator" package must be
          # installed!), which is not on the runner image even though $ANDROID_HOME/emulator exists in
          # some images. compileSdk 37 is left to Gradle: it is not a published SDK package here.
          sdkmanager "emulator" "platform-tools" "system-images;android-34;android-wear;x86_64"

      # The AVD profile is patched instead of trusted: hw.lcd.circular=false and 384x384 are the
      # defaults, and geometry assertions (48 dp targets, round safe area) are written against
      # 466x466 @320.
      - name: Create a 466x466 round AVD
        run: |
          set -euo pipefail
          # No -d profile: `wearos_small_round` is absent from the runner's device list, and the lcd
          # keys are patched below anyway. The image alone is enough to boot headless.
          #
          # `avdmanager` writes under ANDROID_AVD_HOME, which the runner does not set, and its
          # "custom hardware profile?" prompt consumed stdin and exited 2 with no config.ini in the
          # first two attempts. The home is explicit now and the file is FOUND, never assumed.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd -n wear34 -k "system-images;android-34;android-wear;x86_64" --force
          CFG=$(find "$ANDROID_AVD_HOME" -maxdepth 2 -name config.ini | head -1)
          test -n "$CFG" || { echo "::error::avdmanager created no config.ini"; ls -la "$ANDROID_AVD_HOME"; exit 1; }
          echo "patching $CFG"
          sed -i '/hw.lcd.width/d;/hw.lcd.height/d;/hw.lcd.density/d;/hw.lcd.circular/d' "$CFG"
          {
            echo "hw.lcd.width=466"
            echo "hw.lcd.height=466"
            echo "hw.lcd.density=320"
            echo "hw.lcd.circular=yes"
          } >> "$CFG"
          grep -E 'hw.lcd|image.sysdir' "$CFG"

      - name: Boot the emulator
        run: |
          set -euo pipefail
          nohup "$ANDROID_HOME/emulator/emulator" -avd wear34 -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none \
            > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOTED" = "1" ]; then break; fi
            sleep 2
          done
          test "$BOOTED" = "1" || { echo "::error::emulator did not boot"; tail -50 /tmp/emulator.log; exit 1; }
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm size
          adb shell wm density

      # The PR gate runs a NAMED smoke set, not the whole suite. Two classes do not finish on hardware
      # (#50) and the full run was still executing 20+ minutes after boot on this AVD; a gate nobody
      # waits for is not a gate. The full suite stays available through `workflow_dispatch` below and
      # on the physical watch. Every class named here is one the local hardware run passed.
      - name: Instrumented tests (smoke subset, #50 full suite is manual)
        run: |
          set -euo pipefail
          SMOKE="com.nirowear.chat.CompatibleChatTest"
          SMOKE="$SMOKE,com.nirowear.chat.ErrorTextTest"
          SMOKE="$SMOKE,com.nirowear.chat.ComposerSendReachabilityTest"
          SMOKE="$SMOKE,com.nirowear.chat.StreamingUiTest"
          SMOKE="$SMOKE,com.nirowear.chat.StoppedStatusUiTest"
          SMOKE="$SMOKE,com.nirowear.chat.NativeProviderSwitchTest"
          SMOKE="$SMOKE,com.nirowear.security.ByokPersistenceTest"
          SMOKE="$SMOKE,com.nirowear.settings.SettingsRecoveryTest"
          SMOKE="$SMOKE,com.nirowear.renderer.RendererTapAndPanTest"
          SMOKE="$SMOKE,com.nirowear.renderer.LinkActionsTest"
          echo "smoke classes: $SMOKE"
          # The runner is driven directly instead of through the AGP connected task: that task
          # re-serialises the class filter and the runner arrived holding only the first class
          # (artifact 14500777823), so a 10-class gate was silently a 1-class gate. Built APKs plus one
          # literal `am instrument -e class` call make CI and the local run the same invocation.
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
          NAME=$(adb -s emulator-5554 emu avd name 2>/dev/null | head -1 | tr -d '\r')
          test "$NAME" = "wear34" || { echo "::error::emulator-5554 is '$NAME', not wear34"; exit 1; }
          QEMU=$(adb -s emulator-5554 shell getprop ro.kernel.qemu | tr -d '\r')
          test "$QEMU" = "1" || { echo "::error::emulator-5554 is not an emulator (qemu=$QEMU)"; exit 1; }
          adb -s emulator-5554 install -r app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5554 install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          # The raw record is kept even when the run fails: the converter judges it afterwards, and the
          # artifact path below already publishes it.
          RAW=app/build/outputs/androidTest-results/connected/debug/smoke.txt
          mkdir -p "$(dirname "$RAW")"
          set +e
          adb -s emulator-5554 shell am instrument -w -r -e class "$SMOKE" \
            -e notAnnotation com.nirowear.HostDrivenGate \
            com.nirowear.test/androidx.test.runner.AndroidJUnitRunner | tee "$RAW"
          PIPE_CODES=("${PIPESTATUS[@]}")
          set -e
          echo "pipeline exits: ${PIPE_CODES[*]}"
          # Both sides of the pipe are checked: a broken adb transport and a failed tee both lose the
          # evidence, and a lost record must never be read as a pass.
          test "${PIPE_CODES[0]}" = "0" -a "${PIPE_CODES[1]}" = "0" || { echo "::error::am instrument/tee exited ${PIPE_CODES[*]}"; exit 1; }
          python3 scripts/instrumentation-xml.py "$RAW" --smoke-classes "$SMOKE"

      - name: Collect logcat
        if: always()
        run: |
          # `adb logcat` with no device waits forever. The guard and the timeout both exist because
          # the first version of this step outlived the emulator it was meant to report on.
          timeout 30 adb devices || true
          if timeout 30 adb devices | grep -q "device$"; then timeout 60 adb logcat -d > /tmp/logcat.txt || true; fi

      - name: Publish instrumented results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumented-results
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            /tmp/emulator.log
            /tmp/logcat.txt
          if-no-files-found: ignore
