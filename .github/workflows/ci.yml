name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: jvm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties pins toolchainVersion=25, so the
      # runner JVM must be 25 or Gradle provisions a second daemon JVM.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # android-actions/setup-android@v3 is deliberately NOT used: run 40306576936
      # failed inside it with `Failed to find package 'tools'`, because it calls
      # `sdkmanager tools` and that package no longer exists.
      #
      # `sdkmanager` is also not on PATH on ubuntu-latest (run 40306772420 failed
      # with `sdkmanager: command not found`, exit 127), so this step locates it
      # under the preinstalled SDK and appends it to PATH instead of assuming.
      - name: Put the Android SDK tools on PATH
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::no Android SDK at $ANDROID_HOME"; exit 1; }
          CMDLINE=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name bin -type d 2>/dev/null | head -1)
          echo "cmdline-tools bin: ${CMDLINE:-<none>}"
          if [ -n "${CMDLINE:-}" ]; then echo "$CMDLINE" >> "$GITHUB_PATH"; fi
          echo "platforms present:"; ls "$ANDROID_HOME/platforms" || true

      # compileSdk 36 is not on the runner image by default. Gradle can install a
      # missing platform itself when the licence is accepted, which avoids
      # depending on a sdkmanager that may not be on PATH at all.
      - name: Accept SDK licences
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
          else
            echo "sdkmanager still unavailable; relying on the preinstalled platforms"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Test sources are gitignored by policy, so on a fresh clone this task is
      # NO-SOURCE: it exits 0 having run nothing. It is kept because it is the
      # correct command the moment tests are published, but it is NOT the gate.
      # The gate is assemble + lint, which compile every published source file.
      # Test sources are gitignored by policy, so on a fresh clone this task is NO-SOURCE and exits
      # 0 having run nothing. That is stated rather than hidden: a green run must not be
      # indistinguishable from a run that executed zero tests.
      - name: Unit tests (NO-SOURCE on the published tree, by policy)
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # The assertion is CONDITIONAL on purpose. If test sources are present, results are required
      # and their absence fails the job. If they are absent, the job says so and continues — failing
      # there would just be a permanently red CI for a policy decision, and warning there without
      # checking the other branch would let a broken test run pass silently.
      - name: Verify the test step matches reality
        run: |
          set -uo pipefail
          # NOTE: no `set -e`. `find` on a missing directory exits 1, and with `pipefail` that made
          # the whole step die before reaching its own logic — the first version of this check
          # failed CI on a clean clone instead of reporting "no sources". Counting is best-effort;
          # the decision below is explicit.
          sources=$(find app/src/test -name '*.kt' 2>/dev/null | wc -l || echo 0)
          results=$(find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' 2>/dev/null | wc -l || echo 0)
          sources=${sources:-0}
          results=${results:-0}
          echo "test sources: $sources   result XML files: $results"
          if [ "$sources" -gt 0 ] && [ "$results" -eq 0 ]; then
            echo "::error::$sources test sources exist but no results were produced"
            exit 1
          fi
          if [ "$sources" -eq 0 ]; then
            echo "::warning::No test sources are published (app/src/test is gitignored by policy), so this job ran no tests. Build, lint and style are the real gate."
          fi
          exit 0

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Style
        run: ./gradlew :app:ktlintCheck --console=plain

      - name: Assemble debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
