name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: jvm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned by commit SHA, not by a mutable tag: `v4` can be repointed at any time,
      # and this job's toolchain is what a maintainer trusts. Dependabot's github-actions ecosystem
      # keeps the pins current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # gradle/gradle-daemon-jvm.properties pins toolchainVersion=25, so the
      # runner JVM must be 25 or Gradle provisions a second daemon JVM.
      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      # android-actions/setup-android@v3 is deliberately NOT used: run 40306576936
      # failed inside it with `Failed to find package 'tools'`, because it calls
      # `sdkmanager tools` and that package no longer exists.
      #
      # `sdkmanager` is also not on PATH on ubuntu-latest (run 40306772420 failed
      # with `sdkmanager: command not found`, exit 127), so this step locates it
      # under the preinstalled SDK and appends it to PATH instead of assuming.
      - name: Put the Android SDK tools on PATH
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::no Android SDK at $ANDROID_HOME"; exit 1; }
          CMDLINE=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name bin -type d 2>/dev/null | head -1)
          echo "cmdline-tools bin: ${CMDLINE:-<none>}"
          if [ -n "${CMDLINE:-}" ]; then echo "$CMDLINE" >> "$GITHUB_PATH"; fi
          echo "platforms present:"; ls "$ANDROID_HOME/platforms" || true

      # compileSdk 37 is not on the runner image by default. Gradle can install a
      # missing platform itself when the licence is accepted, which avoids
      # depending on a sdkmanager that may not be on PATH at all.
      - name: Accept SDK licences
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
          else
            echo "sdkmanager still unavailable; relying on the preinstalled platforms"
          fi

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Everything that can change the toolchain is part of the key, so a changed wrapper,
          # daemon JVM, catalog or build script cannot be served a stale dependency cache.
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # The 286-test JVM suite is published as of 2026-11-16, so this step is the gate it always
      # claimed to be. The check below still refuses to let a run that produced no results pass.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # The assertion is CONDITIONAL on purpose. If test sources are present, results are required
      # and their absence fails the job. If they are absent, the job says so and continues — failing
      # there would just be a permanently red CI for a policy decision, and warning there without
      # checking the other branch would let a broken test run pass silently.
      - name: Verify the test step matches reality
        run: |
          set -uo pipefail
          # NOTE: no `set -e`. `find` on a missing directory exits 1, and with `pipefail` that made
          # the whole step die before reaching its own logic — the first version of this check
          # failed CI on a clean clone instead of reporting "no sources". Counting is best-effort;
          # the decision below is explicit.
          sources=$(find app/src/test -name '*.kt' 2>/dev/null | wc -l || echo 0)
          results=$(find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' 2>/dev/null | wc -l || echo 0)
          sources=${sources:-0}
          results=${results:-0}
          echo "test sources: $sources   result XML files: $results"
          if [ "$sources" -gt 0 ] && [ "$results" -eq 0 ]; then
            echo "::error::$sources test sources exist but no results were produced"
            exit 1
          fi
          if [ "$sources" -eq 0 ]; then
            echo "::warning::No test sources are published, so this job ran no tests. Build, lint and style are the real gate."
          fi
          exit 0

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Style
        run: ./gradlew :app:ktlintCheck --console=plain

      - name: Assemble debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  # Runs the instrumented suite on a Wear OS 5 (API 34) emulator — the same API level as the physical
  # Xiaomi Watch 2, at the reference 466x466 @320 viewport. This job exists because a green `jvm` job
  # used to mean "the app compiled": nothing instrumented was even published, so no CI run had ever
  # executed one. First run is the evidence; no number here is quoted from a local machine.
  instrumented:
    name: instrumented (Wear OS 5, API 34, 466x466)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Put the Android SDK tools on PATH
        run: |
          set -euo pipefail
          CMDLINE=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name bin -type d 2>/dev/null | head -1)
          test -n "${CMDLINE:-}" || { echo "::error::no cmdline-tools under $ANDROID_HOME"; exit 1; }
          echo "$CMDLINE" >> "$GITHUB_PATH"
          echo "emulator: $ANDROID_HOME/emulator/emulator"

      - name: Require KVM
        run: |
          set -euo pipefail
          ls -l /dev/kvm || true
          test -w /dev/kvm || { echo "::error::/dev/kvm is not writable; the x86_64 emulator cannot boot"; exit 1; }

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-instrumented-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install the Wear OS system image
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "system-images;android-34;android-wear;x86_64"

      # The AVD profile is patched instead of trusted: hw.lcd.circular=false and 384x384 are the
      # defaults, and geometry assertions (48 dp targets, round safe area) are written against
      # 466x466 @320.
      - name: Create a 466x466 round AVD
        run: |
          set -euo pipefail
          echo no | avdmanager create avd -n wear34 -k "system-images;android-34;android-wear;x86_64" -d wearos_small_round --force
          CFG="$HOME/.android/avd/wear34.avd/config.ini"
          sed -i '/hw.lcd.width/d;/hw.lcd.height/d;/hw.lcd.density/d;/hw.lcd.circular/d' "$CFG"
          {
            echo "hw.lcd.width=466"
            echo "hw.lcd.height=466"
            echo "hw.lcd.density=320"
            echo "hw.lcd.circular=yes"
          } >> "$CFG"
          grep -E 'hw.lcd|image.sysdir' "$CFG"

      - name: Boot the emulator
        run: |
          set -euo pipefail
          nohup "$ANDROID_HOME/emulator/emulator" -avd wear34 -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none \
            > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOTED" = "1" ]; then break; fi
            sleep 2
          done
          test "$BOOTED" = "1" || { echo "::error::emulator did not boot"; tail -50 /tmp/emulator.log; exit 1; }
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm size
          adb shell wm density

      - name: Instrumented tests
        run: |
          set -euo pipefail
          ANDROID_SERIAL=emulator-5554 ./gradlew :app:connectedDebugAndroidTest --console=plain

      - name: Collect logcat
        if: always()
        run: adb logcat -d > /tmp/logcat.txt || true

      - name: Publish instrumented results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumented-results
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            /tmp/emulator.log
            /tmp/logcat.txt
          if-no-files-found: ignore
