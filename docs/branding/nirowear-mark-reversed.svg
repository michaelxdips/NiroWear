<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <title>NiroWear — Thread, reversed</title>
  <!-- Reversed lockup: the same outline in ink on a paper ground, for use where the mint
